<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 670" width="600" height="670" role="img" aria-labelledby="vpa-fig-pl-qpcr-title vpa-fig-pl-qpcr-desc" style="display:block;width:100%;height:auto;max-width:600px;margin-inline:auto;font-family:Arial,'Liberation Sans',sans-serif">
<title id="vpa-fig-pl-qpcr-title">Wcześniejsze przekroczenie progu nie jest jeszcze pełnym porównaniem próbek</title>
<desc id="vpa-fig-pl-qpcr-desc">Dwie umowne krzywe o takim samym kształcie przecinają jeden próg. Krzywa A jest ciągła i przecina go wcześniej; B jest przerywana i przecina go później. Pionowe linie są rzutowaniem przecięcia na oś cykli, nie dowodem przyczyny. Brak skali liczbowej jest celowy.</desc>
